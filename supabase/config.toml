# Minimal local Supabase config for Konnector CRM.
#   supabase start      # boots Postgres, Auth, REST, Studio
#   supabase db reset   # applies supabase/migrations/* then supabase/seed.sql
project_id = "konnector-crm"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Internal CRM: accounts are provisioned by an admin, never self-registered.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
